name: IDX ke Telegram

on:
  schedule:
    # Tiap 30 menit, Senin-Jumat, 09:00-17:30 WIB (= 02:00-10:30 UTC)
    - cron: "*/30 2-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idx-telegram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests curl_cffi

      - name: Jalankan bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python idx_telegram.py

      - name: Simpan state (anti kirim ganda)
        run: |
          git config user.name "idx-bot"
          git config user.email "idx-bot@users.noreply.github.com"
          git add sent_ids.json
          git diff --cached --quiet || (git commit -m "update sent_ids" && git push)
